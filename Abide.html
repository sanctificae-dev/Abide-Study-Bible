<title>Abide</title>

<script>try{var t=localStorage.getItem('bib-theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
:root{--cream:#fefae0;--bg:#fefae0;--side:#f7f0cc;--card:#f7f0cc;--ink:#432818;--muted:#432818a8;--line:#43281828;--acc:#6f1d1b;--on-acc:#fefae0;--green:#344e41;--feat:#344e41;--on-feat:#fefae0;--hl1:#6f1d1b45;--hl2:#5f8f7655;--hl3:#b07a4a50;--lp:#432818;--circle:transparent;--fs:20px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=verdant]{--bg:#344e41;--side:#243629;--card:#2b4136;--ink:#fefae0;--muted:#fefae0a8;--line:#fefae030;--acc:#e9c9a0;--on-acc:#432818;--feat:#243629;--circle:#fefae0;--hl1:#e9c9a04d;--hl2:#fefae033;--hl3:#b07a4a80}
:root[data-theme=dark]{--bg:#432818;--side:#2f1b10;--card:#533220;--ink:#fefae0;--muted:#fefae0a8;--line:#fefae030;--acc:#e8a29d;--on-acc:#2f1b10;--feat:#6f1d1b;--on-feat:#fefae0;--hl1:#e8a29d4d;--hl2:#fefae033;--hl3:#b07a4a80;--lp:#432818;--circle:#fefae0}
:root[data-theme=nautical]{--bg:#0D1C42;--side:#010736;--card:#22396F;--ink:#FCF1D0;--muted:#FCF1D0b0;--line:#FCF1D030;--acc:#FCF1D0;--on-acc:#010736;--feat:#22396F;--on-feat:#FCF1D0;--hl1:#FCF1D04d;--hl2:#6f8fd96b;--hl3:#22396Fff;--lp:#0D1C42;--circle:#FCF1D0}
:root[data-theme=lilac]{--bg:#3b2755;--side:#2c1c40;--card:#563979;--ink:#E4DFEB;--muted:#E4DFEBb3;--line:#E4DFEB30;--acc:#B9A9CF;--on-acc:#2c1c40;--feat:#6C223F;--on-feat:#E4DFEB;--hl1:#9C8CAE66;--hl2:#6C223Fcc;--hl3:#E4DFEB33;--lp:#563979;--circle:#E4DFEB}
:root[data-theme=dark],:root[data-theme=verdant],:root[data-theme=nautical],:root[data-theme=lilac]{color-scheme:dark}
option{background:var(--card);color:var(--ink)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pp{font-size:var(--fs);line-height:1.8;margin:0 0 18px}
span.v{margin:0;padding:1px 2px;line-height:inherit}.pp .v sup{margin-left:4px}
.shell.para .col{max-width:max(700px,calc(var(--fs)*36))}
.shell.two .col{max-width:1120px;columns:2 330px;column-gap:64px}
.shell.two .col>.chap,.shell.two .col>.sum,.shell.two .col>.orn,.shell.two .col>.pn,.shell.two .col>.card{column-span:all}
.shell.two .sec{break-after:avoid}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Miller Text","Miller Text Roman",Georgia,"Times New Roman",serif;font-weight:400;transition:background .3s,color .3s}
button,select,input{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:260px 1fr;grid-template-rows:minmax(0,1fr);height:100%;overflow:hidden}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:24px 16px;overflow-y:auto}
.brand{text-align:center;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:16px}
.brand h4{font-weight:400;font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-top:10px}
.brand small{font-size:13px;color:var(--muted)}
.lamb{display:block;margin:0 auto;width:var(--w,90px);aspect-ratio:1;background:var(--circle);border-radius:50%;padding:var(--lpad,0);transition:background .3s}
.lamb i{display:block;width:100%;height:100%;background:var(--lp);-webkit-mask:var(--lamb) center/contain no-repeat;mask:var(--lamb) center/contain no-repeat}
:root[data-theme=dark] .lamb,:root[data-theme=verdant] .lamb,:root[data-theme=nautical] .lamb,:root[data-theme=lilac] .lamb{--lpad:1.5%;box-shadow:0 0 0 4px var(--line)}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:12px;font-size:18px;text-align:left;margin-bottom:2px}
.nav:hover{background:var(--line)}.nav.on{background:var(--acc);color:var(--on-acc)}
.sp{flex:1}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:14px}
.pal button{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.pal button.on{outline:2px solid var(--acc);outline-offset:1px}
.sws3{display:flex;padding-right:4px}.sws3 b{width:12px;height:12px;border-radius:50%;margin-right:-4px;border:1px solid #0003}
.cyc{display:none;margin:14px auto 0;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);place-items:center}
.ibt{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}.ibt:hover{background:var(--line)}
.shell{transition:grid-template-columns .25s}.shell.lc{grid-template-columns:72px 1fr}
.shell.lc aside{padding:20px 10px;overflow:hidden}.shell.lc .nav span,.shell.lc .brand h4,.shell.lc .brand small,.shell.lc .pal{display:none}.shell.lc .nav{justify-content:center;padding:12px 0}.shell.lc .lamb{width:50px!important}.shell.lc .cyc{display:grid}
.rp{transition:width .25s,padding .25s}.rp.c{width:0;padding:0;border:0;overflow:hidden}
.page{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:14px 36px;border-bottom:1px solid var(--line)}
.top h2{font-weight:400;font-size:24px;flex:1;color:var(--acc)}
.sel,.btn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:16px}
.btn.p{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.sel{outline:0}
.body{flex:1;display:flex;min-height:0}
.scroll{flex:1;overflow-y:auto;padding:0 36px 48px}
.col{max-width:700px;margin:0 auto}
.rp{width:310px;border-left:1px solid var(--line);overflow-y:auto;padding:20px;background:var(--side)}
h3{font-weight:400;font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.chap{text-align:center;padding:26px 0 8px}
.chap small{display:block;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.chap h1{font-weight:400;font-size:clamp(44px,9vw,64px);color:var(--acc);line-height:1.1}
.orn{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0 24px}
.orn i{height:1px;width:90px;background:var(--line)}.orn b{width:8px;height:8px;transform:rotate(45deg);background:var(--acc)}
.v{font-size:var(--fs);line-height:1.7;margin-bottom:8px;padding:2px 6px;border-radius:5px;cursor:pointer}
.v:hover{background:var(--line)}
.v sup{font-size:.55em;color:var(--acc);margin-right:6px;font-weight:700;vertical-align:.55em}
p.v:first-of-type:not(:has(sup))::first-letter{font-size:3.2em;float:left;line-height:.85;padding:7px 9px 0 0;color:var(--acc)}
.v.picked{outline:1.5px dashed var(--acc);outline-offset:2px}
.h1{background:var(--hl1)}.h2{background:var(--hl2)}.h3{background:var(--hl3)}
.h4{text-decoration:underline wavy var(--acc) 1px;text-underline-offset:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:6px}
.pn{display:flex;justify-content:space-between;margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px}
.res b{display:block;color:var(--acc);font-weight:400;font-size:15px;letter-spacing:.08em;margin-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;font-size:16px}
.grid button.on,.grid button:hover{background:var(--acc);color:var(--on-acc)}
.bk{display:flex;justify-content:space-between;width:100%;padding:9px 6px;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
.bk.on{color:var(--acc)}.bk span{color:var(--muted);font-size:14px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tools button{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:16px}
.tools button:hover{background:var(--line)}
.sws{display:flex;gap:10px;margin:6px 0 14px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:15px}
.drop{border:2px dashed var(--line);border-radius:20px;padding:30px;text-align:center;transition:.2s;background:var(--card)}
.drop.over{border-color:var(--acc);background:var(--line)}
.drop svg{width:34px;height:34px;color:var(--acc);margin-bottom:6px}
.drop p{color:var(--muted);font-size:15px;margin:4px 0 14px}
.item{display:flex;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;background:var(--card)}
.spine{width:38px;height:52px;border-radius:4px 8px 8px 4px;background:var(--feat);border-left:5px solid var(--acc);flex:none;display:grid;place-items:center;color:var(--on-feat);font-size:11px;letter-spacing:.05em}
.item .m{flex:1;min-width:0}.item .m div:first-child{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m small{color:var(--muted);font-size:14px}
.tag{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
.tag.a{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:18px 0 8px}
.seg button{padding:9px 22px;font-size:16px}.seg button.on{background:var(--acc);color:var(--on-acc)}
.note{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin:10px 0 0}
.note svg{width:16px;height:16px;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:34px 0}
.vod{background:var(--feat);color:var(--on-feat);border-radius:22px;padding:30px;margin:26px 0 14px;display:flex;gap:26px;align-items:center}
.vod p{font-size:23px;line-height:1.5;margin:8px 0}.vod small{letter-spacing:.25em;font-size:12px;text-transform:uppercase;opacity:.75}
.ring{width:90px;height:90px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p,0)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring div{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:21px}
.row2{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:19px}
.tg{width:48px;height:27px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--ink);transition:.2s}
.tg.on{background:var(--acc)}.tg.on:after{left:24px;background:var(--on-acc)}
.search{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);padding:14px 20px;border-radius:99px;margin:26px 0 8px}
.search input{flex:1;background:none;border:0;outline:0;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 22px;border-radius:99px;font-size:16px;opacity:0;transition:.25s;z-index:9;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.v i{font-style:italic}.v s{text-decoration:none;font-variant:small-caps;letter-spacing:.04em}
.sum{text-align:center;font-style:italic;color:var(--muted);font-size:calc(var(--fs)*.8);line-height:1.5;margin:-6px auto 18px;max-width:580px}
.gn{display:inline-block;width:6px;height:6px;border:1.5px solid var(--acc);border-radius:50%;margin-left:6px;vertical-align:middle}
.sec{font-size:calc(var(--fs)*.72);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin:24px 0 8px;text-align:center}
.ex p{font-size:var(--fs);line-height:1.7;margin:0 0 14px}.ex h1,.ex h2,.ex h3,.ex h4{font-weight:400;color:var(--acc);margin:24px 0 10px;line-height:1.25}
.ex blockquote{border-left:3px solid var(--acc);padding-left:16px;color:var(--muted);margin:0 0 14px}.ex li{font-size:var(--fs);line-height:1.6}
.days{display:flex;gap:6px}.days span{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);font-size:14px}.days .d{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:9px;margin:14px 0 2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.refs{display:flex;flex-wrap:wrap;gap:6px}mark{background:var(--hl1);color:inherit;border-radius:3px;padding:0 2px}
@media(max-width:900px){.shell,.shell.lc{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}aside{flex-direction:row;flex-wrap:wrap;padding:10px;align-items:center;gap:4px}.brand{display:none}.nav{width:auto;padding:8px 12px;font-size:15px}.nav span{display:none}.sp{display:none}.pal{display:none}.cyc{display:grid;margin:0 0 0 auto;width:36px;height:36px}#tl{display:none}.rp{position:fixed;left:0;right:0;bottom:0;width:100%;max-height:62vh;z-index:8;border:0;border-top:1px solid var(--line);border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0004;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}.rp.c{display:none}.top,.scroll{padding-left:18px;padding-right:18px}}
</style></head>

function ex(){
 if(S.exOpen){const secs=EX[S.exOpen]||[],n=secs.length,i=Math.max(0,Math.min(S.exSec,n-1)),s=secs[i];S.exSec=i;
  return `<div class="scroll" id="sc"><div class="col ex"><div class="chap">${lamb(90)}<small style="margin-top:12px">${esc(exTitle())}</small><h1 style="font-size:38px">${esc(s?s.t:'')}</h1></div><div class="orn"><i></i><b></b><i></i></div>${s?s.h:''}<div class="pn"><button class="btn" id="xp" aria-label="Previous section" ${i?'':'disabled style="opacity:.4"'}>${ic('l')}</button><span style="color:var(--muted);align-self:center">${i+1} / ${n}</span><button class="btn" id="xn" ${i<n-1?'':'disabled style="opacity:.4"'}>Next</button></div></div></div><div class="rp ${S.rc?'c':''}" id="rp"><h3 style="margin-top:0">Contents</h3>${secs.map((x,j)=>`<button class="bk ${j===i?'on':''}" data-s="${j}">${esc(x.t)}</button>`).join('')}</div>`}
 const list=S.items.filter(i=>i.kind==='ex');
 return `<div class="scroll"><div class="col"><br>${zone('Add extra-biblical texts','Apocrypha, early church writings, commentaries, devotionals. Accepts EPUB, TXT, Markdown or HTML.')}
 <div class="note">${ic('lock')}<span>Texts stay on this device. Your place in each one is remembered.</span></div>
 <h3>${list.length} text${list.length===1?'':'s'}</h3>
 ${list.length?list.map(i=>{const p=prog(i.id);return `<div class="item"><div class="spine">${ic('ex')}</div><div class="m"><div>${esc(i.name)}</div><small>${i.sections||0} section${i.sections===1?'':'s'}${p?' · at section '+(p+1):''} · ${fmt(i.size)}</small></div><button class="btn p" data-read="${i.id}">${p?'Continue':'Read'}</button><button class="btn" data-del="${i.id}" title="Remove">${ic('x')}</button></div>`}).join(''):`<div class="empty">${lamb(120)}<br><br>Your shelf is empty. Add a text above to begin.</div>`}</div></div>`}
async function openEx(id){S.exOpen=id;S.exSec=prog(id);if(!EX[id])EX[id]=await idbGet('ex:'+id);if(!EX[id]||!EX[id].length){toast('This text is not stored on this device. Please add it again.');S.exOpen=null}render()}
const GH_REPO='https://github.com/sanctificae-dev/Bible-translations';
const DEF_SRC='https://sanctificae-dev.github.io/Bible-translations/translations.json';
const cands=u=>{const m=/^https?:\/\/github\.com\/([^/]+)\/([^/#?]+?)(?:\.git)?\/?$/.exec(u.trim());if(!m)return[u];const[,o,r]=m;return[`https://${o.toLowerCase()}.github.io/${r}/translations.json`,`https://raw.githubusercontent.com/${o}/${r}/main/translations.json`,`https://raw.githubusercontent.com/${o}/${r}/master/translations.json`]};
async function fetchCatalog(u){let err='';for(const c of (u===DEF_SRC?[DEF_SRC,...cands(GH_REPO).slice(1)]:cands(u))){try{const r=await fetch(c,{cache:'no-cache'});if(!r.ok){err='Not found (HTTP '+r.status+') at '+c;continue}let j;try{j=JSON.parse((await r.text()).replace(/^\uFEFF/,''))}catch(e){err='The file at '+c+' isn’t valid JSON.';continue}const L=(Array.isArray(j)?j:j.translations||[]).filter(x=>x&&x.name&&x.url).map(x=>({name:String(x.name),url:new URL(x.url,c).href,kind:x.kind==='ex'?'ex':'tr'}));if(!L.length){err='The list at '+c+' has no entries with a name and url.';continue}return L}catch(e){err='Couldn’t reach '+c+'. Check your connection and the link.'}}throw new Error(err)}
const srcGet=()=>{try{return localStorage.getItem('bib-src')||DEF_SRC}catch(e){return DEF_SRC}};
const dlRows=()=>{const c=(S.catalog||[]).filter(x=>x.kind==='tr');return c.length?'<h3 style="text-align:center">Download</h3>'+c.map(x=>{const i=S.catalog.indexOf(x),have=S.items.some(y=>y.name===x.name.replace(/_+/g,' ').trim());return `<div class="row2"><span>${esc(x.name)}</span><button class="btn p" data-dl="${i}" ${have?'disabled style="opacity:.5"':''}>${have?'Added':'Download'}</button></div>`}).join(''):(S.srcErr?`<div class="note" style="justify-content:center">${esc(S.srcErr)}</div>`:'')};
async function autoCatalog(){const u=srcGet();if(!/\.json(\?|$)/i.test(u)&&cands(u).length===1)return;try{S.catalog=await fetchCatalog(u);S.srcErr='';if((S.tab==='read'&&!act())||S.tab==='lib')render()}catch(e){S.srcErr=e.message;if((S.tab==='read'&&!act())||S.tab==='lib')render()}}
async function fetchSrc(u,name,kind){try{toast('Downloading “'+name+'”…');const r=await fetch(u);if(!r.ok)throw 0;const b=await r.blob(),ext=(new URL(u,location.href).pathname.split('.').pop()||'epub').toLowerCase();await ingest([new File([b],name.replace(/[\\/:*?"<>|]/g,' ')+'.'+ext)],kind||'tr')}catch(e){toast('Couldn’t download that. Check the link, and that your server allows cross-origin requests (CORS).')}}
async function loadManifest(){const u=$('#su').value.trim();if(!u)return;try{localStorage.setItem('bib-src',u)}catch(e){}
 if(!/\.json(\?|$)/i.test(u)&&cands(u).length===1)return fetchSrc(u,decodeURIComponent(u.split('?')[0].split('/').pop().replace(/\.[^.]+$/,''))||'Translation');
 S.srcErr='';toast('Loading list…');try{S.catalog=await fetchCatalog(u);toast(S.catalog.length+' available to download')}catch(e){S.srcErr=e.message}render()}
const srcCard=()=>`<h3>Download from your source</h3><div class="card"><div class="search" style="margin:0 0 10px">${ic('up')}<input id="su" placeholder="Link to a list (.json) or a single file" value="${esc(srcGet())}"></div><button class="btn p" id="sl">Load</button>${S.srcErr?`<div class="note">${esc(S.srcErr)}</div>`:''}${(S.catalog||[]).map((c,i)=>{const have=S.items.some(x=>x.name===c.name.replace(/_+/g,' ').trim());return `<div class="row2"><span>${esc(c.name)}</span><button class="btn" data-dl="${i}" ${have?'disabled style="opacity:.5"':''}>${have?'Added':'Download'}</button></div>`}).join('')}</div>`;
function bindLib(){
 document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.ver=b.dataset.use;toast('Active translation updated');render()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const id=b.dataset.del;delete DB[id];delete EX[id];idbDel(id);idbDel('ex:'+id);S.items=S.items.filter(i=>i.id!==id);if(S.ver===id){const f=S.items.find(i=>i.kind==='tr');S.ver=f?f.id:null}if(S.exOpen===id)S.exOpen=null;save();render()});
 document.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>openEx(b.dataset.read));
 document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.exSec=+b.dataset.s;setProg();render()});
 if($('#xp'))$('#xp').onclick=()=>{S.exSec--;setProg();render()};
 if($('#xn'))$('#xn').onclick=()=>{S.exSec++;setProg();render()};
 if($('#goex'))$('#goex').onclick=()=>{S.tab='ex';render()};
 if($('#sl'))$('#sl').onclick=loadManifest;document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const c=S.catalog[+b.dataset.dl];fetchSrc(c.url,c.name,c.kind)});
 const dz=$('#dz');if(dz){['dragover','dragenter'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.add('over')}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.remove('over')}));dz.addEventListener('drop',x=>ingest(x.dataTransfer.files,S.tab==='ex'?'ex':'tr'))}}
async function ingest(files,kind){
 for(const f of [...files]){
  const ext=(f.name.split('.').pop()||'').toLowerCase(),base=f.name.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim();
  const it={id:'u'+Date.now()+Math.random().toString(36).slice(2,6),kind,name:base,ext,size:f.size,saved:true};
  if(!['epub','txt','md','markdown','html','htm'].includes(ext)){toast('“'+f.name+'” isn’t supported. Please use EPUB, TXT, Markdown or HTML (Kindle files and PDFs need converting to EPUB first).');continue}
  toast('Reading “'+base+'”… this can take a few seconds');
  try{
   if(kind==='tr'){const b=await importBible(f);
    if(b){DB[it.id]=b;const ok=await idbSet(it.id,b);it.verses=vcount(it);S.items.push(it);if(!act())S.ver=it.id;save();render();toast('Added “'+base+'” with '+it.verses.toLocaleString()+' verses'+(ok?'':' (could not be saved on this device)'));continue}
    toast('No Bible structure found. Adding it to Extra-Biblical instead.');it.kind='ex'}
   const secs=await importText(f,ext);if(!secs||!secs.length)throw 0;
   EX[it.id]=secs;await idbSet('ex:'+it.id,secs);it.sections=secs.length;S.items.push(it);save();render();toast('Added “'+base+'” to Extra-Biblical')
  }catch(e){toast('Couldn’t read “'+base+'”. Try an EPUB, TXT, Markdown or HTML file.')}}}
function render(){try{localStorage.setItem('bib-ver',S.ver)}catch(e){}
 side();topbar();$('.shell').classList.toggle('lc',!!S.lc);layout();
 const o=$('#bd .scroll'),ot=o?o.scrollTop:0,k=S.tab+'|'+S.b+'|'+(S.cont?'c':S.c)+'|'+S.cont+'|'+S.exOpen+'|'+S.exSec;persist();if(k!==LK)S.ex2=[];
 $('#bd').innerHTML=({read:reader,search,marks,plan,lib,ex,gh:words,set:settings})[S.tab]();
 const n=$('#bd .scroll');if(n){if(k===LK)n.scrollTop=ot;else{const e=n.querySelector('.v.picked');if(e)e.scrollIntoView({block:'center'});else if(S.cont){const c=$('#ch'+S.c);if(c)c.scrollIntoView()}}}LK=k;if(S.jump){const c=$('#ch'+S.jump);if(c)c.scrollIntoView();S.jump=0}
 if($('#go'))$('#go').onclick=()=>{S.tab='lib';render()};
 if(S.tab==='search'){const q=$('#q');q.value=S.q||'';q.oninput=()=>{S.q=q.value;clearTimeout(DT);DT=setTimeout(doSearch,150)};doSearch()}
 if(S.tab==='read'&&act()){
  $('#bd').querySelectorAll('.v').forEach(p=>{p.onclick=e=>{if(String(getSelection()))return;const v=+p.dataset.v,cn=+(p.dataset.ch||S.c);if(cn!==S.c){S.c=cn;S.sel=null;S.ex2=[]}const cur=selv();
   if(e.shiftKey&&S.sel!==null){const a=Math.min(S.sel,v),z=Math.max(S.sel,v),ex=chData().v.map(x=>x[0]);S.ex2=ex.filter(i=>i>=a&&i<=z&&i!==S.sel)}
   else if(cur.includes(v)){const r=cur.filter(x=>x!==v);S.sel=r.length?r[0]:null;S.ex2=r.slice(1)}
   else{const all=[...cur,v].sort((x,y)=>x-y);S.sel=all[0];S.ex2=all.slice(1)}
   if(S.sel!==null&&innerWidth<=900)S.rc=false;render()};p.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();p.click()}}});
  $('#pv').onclick=()=>step(-1);$('#nx').onclick=()=>step(1);
  $('#bd').querySelectorAll('[data-td]').forEach(b=>b.onclick=()=>toggleDone(...b.dataset.td.split('|')));
  const sc0=$('#sc');if(S.cont&&sc0){let tk=0;sc0.onscroll=()=>{if(tk)return;tk=requestAnimationFrame(()=>{tk=0;if(S.sel!==null)return;let n=1;sc0.querySelectorAll('.chap[id^=ch]').forEach(h=>{if(h.offsetTop-sc0.offsetTop<=sc0.scrollTop+90)n=+h.id.slice(2)});if(n!==S.c){S.c=n;const t=$('#tp h2');if(t)t.textContent=BOOKS[S.b].n+' '+n;document.querySelectorAll('#rp [data-c]').forEach(b=>b.classList.toggle('on',+b.dataset.c===n));persist()}})}}
  const nt0=$('#nt');if(nt0)nt0.oninput=()=>{const k=key(S.sel),t=nt0.value.trim();t?S.notes[k]=t:delete S.notes[k];persist()};
  const rp=$('#rp');
  rp.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{S.b=+b.dataset.b;S.c=1;S.sel=null;render()});
  rp.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.c=+b.dataset.c;S.sel=null;if(S.cont)S.jump=S.c;if(innerWidth<=900)S.rc=true;render()});
  rp.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{selv().forEach(v=>{const k=key(v);b.dataset.h?S.hl[k]=b.dataset.h:delete S.hl[k]});render()});
  rp.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const k=key(S.sel),a=b.dataset.a;
   if(a==='bm'){const vs=selv(),all=vs.every(v=>S.bm[key(v)]);vs.forEach(v=>all?delete S.bm[key(v)]:S.bm[key(v)]=1)}
   if(a==='note'){const t=$('#nt').value.trim();t?S.notes[k]=t:delete S.notes[k];toast('Note saved')}
   if(a==='copy'){const vs=selv();try{navigator.clipboard.writeText(vs.map(v=>(vs.length>1?v+' ':'')+verseText(S.b,S.c,v)).join(' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>')+' — '+BOOKS[S.b].n+' '+S.c+':'+vlabel(vs))}catch(e){}toast('Copied')}
   if(a==='x'){S.sel=null;if(innerWidth<=900)S.rc=true}render()});
 }
 if(S.tab==='lib'||S.tab==='ex')bindLib();
 document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const c=S.catalog[+b.dataset.dl];fetchSrc(c.url,c.name,c.kind)});
 if(S.tab==='plan')bindPlans();
 if(S.tab==='marks'){$('#bd').querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{const[b,c,v]=x.dataset.g.split('.').map(Number);S.b=b;S.c=c;S.sel=v;S.tab='read';render()});$('#bd').querySelectorAll('[data-mf]').forEach(x=>x.onclick=()=>{S.mf=x.dataset.mf;render()})}
 if(S.tab==='set'){$('#bx').onclick=exportData;$('#bi').onclick=()=>$('#bf').click()}
 if(S.tab==='gh'){$('#bd').querySelectorAll('[data-gf]').forEach(x=>x.onclick=()=>{S.gf=x.dataset.gf;render()});const g=$('#gq');g.oninput=()=>{S.gq=g.value;$('#gl').innerHTML=wlist()}}
}

function step(d){if(S.cont){const b=S.b+d;if(b<0||b>65)return;S.b=b;S.c=1;S.sel=null;render();return}S.c+=d;if(S.c<1){if(S.b===0)S.c=1;else{S.b--;S.c=BOOKS[S.b].c}}else if(S.c>BOOKS[S.b].c){if(S.b<BOOKS.length-1){S.b++;S.c=1}else S.c-=d}S.sel=null;render()}
const exportData=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'abide',hl:S.hl,bm:S.bm,notes:S.notes,plans:S.plans,fs:S.fs,vm:S.vm},null,1)],{type:'application/json'}));a.download='abide-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('#bf').onchange=async e=>{try{const u=JSON.parse(await e.target.files[0].text());if(u.app!=='abide')throw 0;Object.assign(S.hl,u.hl||{});Object.assign(S.bm,u.bm||{});Object.assign(S.notes,u.notes||{});if(u.plans){Object.assign(S.plans,u.plans);savePlans()}persist();toast('Backup imported');render()}catch(x){toast('That file isn’t an Abide backup')}e.target.value=''};
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tg')){e.preventDefault();e.target.click()}if(e.key==='Escape'&&S.tab==='read'&&S.sel!==null){S.sel=null;render()}});
$('#fi').onchange=e=>{ingest(e.target.files,S.tab==='ex'?'ex':'tr');e.target.value=''};
document.addEventListener('keydown',e=>{if(S.tab==='read'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)}});
render();
(async()=>{await Promise.all(S.items.filter(i=>i.kind==='tr').map(async i=>{const d=await idbGet(i.id);if(d)DB[i.id]=d}));S.ready=true;render();autoCatalog()})();
</script>
</body></html>
